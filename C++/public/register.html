<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - CodeOJ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-intro" aria-labelledby="authIntroTitle">
            <a href="index.html" class="logo" aria-label="CodeOJ 首页">
                <span class="logo-text">CodeOJ</span>
            </a>
            <p class="eyebrow">开始你的 C++ 练习</p>
            <h1 id="authIntroTitle">从第一道题，<br>开始积累自己的进步。</h1>
            <p>选择适合自己的题目，写下思路，用评测反馈不断完善答案。</p>
            <p class="auth-intro-note">分级题库 · 在线编辑 · 个人统计</p>
        </section>
        <section class="auth-card" aria-labelledby="registerTitle">
            <div class="auth-header">
                <p class="eyebrow">注册账号</p>
                <h2 id="registerTitle">创建你的 CodeOJ 账号</h2>
                <p>建立自己的练习记录，从现在开始。</p>
            </div>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="3–64 个字符" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="usernameHint" required>
                    <p id="usernameHint" class="form-hint">用于登录，请记住你的用户名。</p>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="至少 6 个字符" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" autocomplete="new-password" required>
                </div>
                <div id="registerError" class="error-message" role="alert" aria-live="polite"></div>
                <button type="submit" class="btn-submit">创建账号</button>
            </form>
            <div class="auth-footer">
                <p>已有账号？<a href="login.html">去登录</a></p>
                <a href="index.html" class="back-link">返回首页</a>
            </div>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
