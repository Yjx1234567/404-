<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - CodeOJ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <a href="index.html" class="logo">
                    <span class="logo-icon">&lt;/&gt;</span>
                    <span class="logo-text">CodeOJ</span>
                </a>
                <nav class="app-nav" aria-label="主要导航">
                    <a href="problem_list.html" class="nav-link">题库</a>
                    <a href="submissions.html" class="nav-link">提交记录</a>
                    <a href="leaderboard.html" class="nav-link">排行榜</a>
                    <a href="profile.html" class="nav-link">个人中心</a>
                </nav>
            </div>
            <div class="header-right">
                <span id="userInfo" class="user-info"></span>
                <a href="admin.html" id="adminLink" class="admin-link hidden" aria-current="page">管理后台</a>
                <button id="logoutBtn" class="btn-logout" type="button">退出</button>
            </div>
        </header>
        
        <main id="mainContent" tabindex="-1" class="main-content admin-layout">
            <div class="page-heading admin-heading">
                <p class="eyebrow">ADMINISTRATION</p>
                <h1>题目管理</h1>
                <p class="page-description">维护题目内容、代码模板与测试用例。</p>
            </div>
            <section class="admin-panel create-panel" aria-labelledby="createHeading">
                <div class="section-heading">
                    <h2 id="createHeading">新增题目</h2>
                    <p class="page-description">填写题目内容，并配置评测所需的输入与期望输出。</p>
                </div>
                <form id="createProblemForm" class="admin-form">
                    <div class="form-group">
                        <label for="title">标题</label>
                        <input type="text" id="title" placeholder="为题目起一个清晰的标题" required>
                    </div>
                    <div class="form-group">
                        <label for="difficulty">难度</label>
                        <select id="difficulty">
                            <option value="Easy">简单 · Easy</option>
                            <option value="Medium">中等 · Medium</option>
                            <option value="Hard">困难 · Hard</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="content">题目描述</label>
                        <p class="form-hint" id="contentHint">支持 Markdown，可填写题目要求、输入输出格式与示例。</p>
                        <textarea id="content" rows="8" aria-describedby="contentHint" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="template">代码模板</label>
                        <textarea id="template" rows="7" spellcheck="false">#include <iostream>
using namespace std;

int main() {
    
    return 0;
}</textarea>
                    </div>
                    <div class="form-group">
                        <span class="form-label" id="testCaseLabel">测试用例</span>
                        <p class="form-hint">每行配置一组输入和期望输出，可添加多组测试用例。</p>
                        <div id="testCaseContainer" class="testcase-container" role="group" aria-labelledby="testCaseLabel">
                            <div class="testcase-item">
                                <input type="text" class="tc-input" placeholder="输入" aria-label="测试用例输入">
                                <input type="text" class="tc-expected" placeholder="期望输出" aria-label="测试用例期望输出">
                                <button type="button" class="btn-remove-tc" aria-label="删除此测试用例">&times;</button>
                            </div>
                        </div>
                        <button type="button" id="addTestCaseBtn" class="btn-add">添加测试用例</button>
                    </div>
                    <div id="createError" class="error-message" role="alert"></div>
                    <div id="createSuccess" class="success-message" role="status"></div>
                    <button type="submit" class="btn-submit">创建题目</button>
                </form>
            </section>
            
            <section class="admin-panel list-panel" aria-labelledby="manageHeading">
                <div class="section-heading">
                    <h2 id="manageHeading">已有题目</h2>
                    <p class="page-description">删除操作会移除题目，请确认后操作。</p>
                </div>
                <div id="adminProblemList" class="admin-problem-list">
                    <div class="loading">加载中...</div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
